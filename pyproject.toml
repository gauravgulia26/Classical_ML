[project]
name = "classical-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gauravgulia26", email = "grvgulia007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "mlxtend>=0.25.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
]

[project.scripts]
classical-ml = "classical_ml:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "humanize>=4.16.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "rich>=15.0.0",
    "tqdm>=4.70.0",
]
